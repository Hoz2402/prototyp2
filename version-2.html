<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf6ed"><title>nah — Unterstützung im Studium · Version 2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#28332c;--muted:#6e776e;--paper:#fbf6ed;--white:#fffdf9;--sage:#dce9d8;--green:#45664e;--coral:#f3ded1;--lav:#e9e3f1;--sun:#f5e8c8;--line:#e9e1d6;--shadow:0 12px 34px #604d3510}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit}button,input,select{font:inherit}.shell{max-width:1160px;margin:auto;padding:0 38px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:800 25px Manrope,sans-serif;letter-spacing:-1.8px;text-decoration:none}.brand i{color:#83a27b;font-style:normal}.topright{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:13px}.pill{border:0;border-radius:99px;padding:11px 17px;background:#a55242;color:white;font-weight:700;cursor:pointer;box-shadow:0 5px 14px #a5524225}.pill:hover,.cta:hover{filter:brightness(.95)}.hero{position:relative;display:grid;grid-template-columns:1.3fr .7fr;align-items:center;gap:20px;padding:51px 0 25px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#718a68}.hero h1{font:700 clamp(36px,5vw,58px)/1.08 Manrope,sans-serif;letter-spacing:-2.5px;max-width:680px;margin:13px 0 14px}.hero p{font-size:15px;line-height:1.7;color:var(--muted);max-width:570px;margin:0}.illustration{justify-self:end;width:min(255px,100%);height:auto}.crisis-small{padding:11px 14px;border-radius:12px;background:#f2ebe1;color:#786e61;font-size:12px;line-height:1.5;margin:12px 0 27px}.crisis-small strong{color:#4b5047}.crisis-small a{font-weight:700;color:#8a5142}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:0 0 14px}.sectionhead h2{font:700 19px Manrope,sans-serif;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:var(--white);border:1px solid #eee7dc;border-radius:22px;padding:22px;min-height:176px;text-decoration:none;display:flex;flex-direction:column;position:relative;transition:transform .15s,box-shadow .15s}.card:hover,.option:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.icon{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:21px;margin-bottom:15px}.card:nth-child(1) .icon{background:var(--sage)}.card:nth-child(2) .icon{background:var(--coral)}.card:nth-child(3) .icon{background:var(--lav)}.card:nth-child(4) .icon{background:var(--sun)}.card h3{font:700 17px Manrope,sans-serif;margin:0 0 6px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;max-width:390px}.arrow{position:absolute;right:20px;bottom:18px;color:#788477}.view{padding:34px 0 66px;min-height:77vh}.back{border:0;background:none;padding:0;cursor:pointer;color:#647465;font-size:13px;margin-bottom:27px}.viewhead{margin-bottom:24px}.viewhead .eyebrow{margin-bottom:9px}.viewhead h1{font:700 clamp(30px,4vw,43px)/1.1 Manrope,sans-serif;letter-spacing:-1.8px;margin:0 0 11px}.viewhead p{color:var(--muted);line-height:1.65;max-width:660px;margin:0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{background:var(--white);border:1px solid #eee7dc;border-radius:18px;padding:19px;transition:.15s}.option h3{font:700 16px Manrope,sans-serif;margin:0 0 7px}.option p{font-size:13px;line-height:1.58;color:var(--muted);margin:0}.chip{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#748669;margin-bottom:8px;font-weight:700}.cta{display:inline-block;margin-top:13px;padding:9px 13px;border-radius:99px;background:var(--green);color:#fff;text-decoration:none;font-size:12px;font-weight:600}.notice{background:#f1ecdf;padding:15px 17px;border-radius:14px;color:#635f54;font-size:12px;line-height:1.6;margin:19px 0}.notice b{color:var(--ink)}.subnav{display:flex;gap:9px;flex-wrap:wrap;margin:19px 0}.subnav button{border:1px solid var(--line);background:var(--white);border-radius:99px;padding:9px 13px;color:#59675b;font-size:12px;cursor:pointer}.crisis{background:#f8e6dc;border-radius:18px;padding:20px;margin:16px 0}.crisis h3{font:700 17px Manrope;margin:0 0 7px}.crisis p{font-size:13px;line-height:1.6;color:#655c55;margin:0}.bigphone{display:inline-block;font:800 25px Manrope;color:#9b4e3d;text-decoration:none;margin:5px 0}.contact{background:var(--white);border:1px solid #eee7dc;border-radius:18px;padding:18px 20px;margin:11px 0}.contact h3{font:700 16px Manrope;margin:0 0 6px}.contact>p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 11px}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.detail{background:#faf6ef;border-radius:11px;padding:10px}.detail b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#81877b;margin-bottom:5px}.detail span,.detail a{font-size:12px;line-height:1.45;overflow-wrap:anywhere}.detail a{color:#47664f}.selector{display:flex;align-items:center;gap:10px;margin:10px 0 17px;flex-wrap:wrap}.selector label{font-size:13px;font-weight:700}.selector select{border:1px solid var(--line);border-radius:10px;background:var(--white);padding:10px 35px 10px 12px;color:var(--ink)}.small{font-size:11px;color:var(--muted)}.list{display:grid;gap:11px}.help{background:var(--white);border:1px solid #eee7dc;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.help h3{font:700 15px Manrope;margin:0 0 5px}.help p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.phone{font:700 17px Manrope;color:#45664e;text-decoration:none;white-space:nowrap;text-align:right}.phone small{display:block;font:500 10px 'DM Sans';color:var(--muted)}footer{border-top:1px solid var(--line);padding:20px 0 30px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{color:inherit}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#354739;color:white;padding:12px 17px;border-radius:99px;font-size:12px}.hidden{display:none!important}
@media(max-width:680px){.shell{padding:0 19px}.top{height:65px}.topright{gap:0}.topright>span{display:none}.hero{grid-template-columns:1fr;padding:37px 0 16px}.hero h1{letter-spacing:-1.7px}.illustration{position:absolute;right:0;top:40px;width:105px;opacity:.92}.hero>div:first-child{padding-right:72px}.cards,.options{grid-template-columns:1fr}.card{min-height:155px;padding:19px}.crisis-small{margin-top:8px}.details{grid-template-columns:repeat(2,minmax(0,1fr))}.help{grid-template-columns:1fr}.phone{text-align:left;justify-self:start}.view{padding-top:25px}}
</style></head><body><div class="shell"><header class="top"><a href="#home" class="brand">nah<i>.</i></a><div class="topright"><span>Gemeinsam finden wir einen nächsten Schritt.</span><button class="pill" id="quickHelp">Sofort Hilfe</button></div></header><main id="app"></main><footer><span>nah. · Orientierung und Unterstützung im Studium</span><span><a href="#privacy">Datenschutz & Hinweise</a> · Version 2</span></footer></div><script>
const app=document.querySelector('#app');
const art=`<svg class="illustration" viewBox="0 0 260 225" role="img" aria-label="Illustration: eine unterstützende Person hört zu"><ellipse cx="136" cy="205" rx="98" ry="13" fill="#e8ddcb"/><path d="M47 160c7-53 33-77 83-77s78 24 84 77v35H47z" fill="#dce9d8"/><path d="M88 97c0-33 17-54 44-54s45 20 45 52v31c0 27-20 48-45 48s-44-21-44-48z" fill="#f2c6a8"/><path d="M86 99c-4-34 9-62 44-62 31 0 49 24 46 59-10-3-20-13-25-24-13 15-38 25-65 27z" fill="#58453b"/><path d="M109 110h1m42 0h1" stroke="#42382f" stroke-width="5" stroke-linecap="round"/><path d="M119 135q14 13 28 0" fill="none" stroke="#a65c4a" stroke-width="4" stroke-linecap="round"/><path d="M69 162c20-15 37-20 63-20s47 8 64 25" fill="none" stroke="#789a79" stroke-width="7" stroke-linecap="round"/><path d="M40 71q-10-15 5-23 12-7 21 4 12-11 22-1 13 12-1 24L66 95z" fill="#e9b7a0" opacity=".75"/><path d="M210 62q-7-10 4-16 8-5 15 3 8-8 15-1 9 8-1 16l-14 14z" fill="#c9d7bd"/><circle cx="65" cy="42" r="4" fill="#d79579"/><circle cx="225" cy="115" r="5" fill="#d9b96f"/></svg>`;
const cards=[['☼','Psychologische Beratung','Anonym mit Fachleuten sprechen oder einen Beratungstermin finden.','psych'],['♡','Kontaktmöglichkeiten','Ansprechpersonen an deiner Hochschule und passende externe Hilfen.','kontakt'],['◉','Persönlicher Austausch','Mit Studierenden sprechen, die ähnliche Situationen kennen.','forum'],['↗','Finanzielle Unterstützung','Orientierung zu BAföG, Wohngeld, Wohnraum und Studienstart.','geld']];
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">Du bist hier richtig</span><h1>Studieren kann viel sein.<br>Du musst es nicht allein schaffen.</h1><p>Diese Seite richtet sich an Studierende, die gerade Unterstützung, ein offenes Ohr oder konkrete Hilfe im Studienalltag suchen. Wir zeigen dir mögliche nächste Schritte – du entscheidest, was für dich passt.</p></div>${art}</section><div class="crisis-small"><strong>Wenn du gerade sofort mit jemandem sprechen möchtest:</strong> TelefonSeelsorge <a href="tel:116123">116 123</a> · anonym, kostenfrei und rund um die Uhr. <button class="quiet" onclick="go('krise')" style="color:#8a5142;font-size:12px;font-weight:700;cursor:pointer">Weitere Krisenhilfe →</button><br>Bei unmittelbarer Gefahr: <a href="tel:112">112</a> (Rettungsdienst) oder <a href="tel:110">110</a> (Polizei).</div><div class="sectionhead"><h2>Wobei können wir dich unterstützen?</h2><span>4 Themenbereiche</span></div><section class="cards">${cards.map(c=>`<a class="card" href="#${c[3]}"><span class="icon">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p><span class="arrow">↗</span></a>`).join('')}</section></section>`}
function head(k,t,d){return `<button class="back" onclick="go('home')">← Zur Übersicht</button><div class="viewhead"><span class="eyebrow">${k}</span><h1>${t}</h1><p>${d}</p></div>`}
function opts(items){return `<div class="options">${items.map(x=>`<article class="option"><span class="chip">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p>${x[3]?`<a class="cta" href="${x[3]}" target="_blank" rel="noopener">${x[4]||'Mehr erfahren'} ↗</a>`:''}</article>`).join('')}</div>`}
function nav(...items){return `<div class="subnav">${items.map(i=>`<button onclick="go('${i[1]}')">${i[0]}</button>`).join('')}</div>`}
function psych(){app.innerHTML=`<section class="view">${head('Psychologische Beratung','Ein erster Schritt in deinem Tempo.','Du kannst anonym mit Fachleuten sprechen oder Unterstützung bei der Suche nach einem Termin erhalten.')}${opts([['Anonym & direkt','TelefonSeelsorge','Kostenfrei, vertraulich und rund um die Uhr erreichbar. Telefonisch, im Chat oder per Mail.','https://www.telefonseelsorge.de/','Beratungsmöglichkeiten'],['Termin finden','Psychotherapie-Suche','Die 116117 unterstützt bei der Suche nach psychotherapeutischen Sprechstunden und Terminen. Verfügbarkeit kann variieren.','https://www.116117.de/','116117 öffnen'],['An der Hochschule','Psychologische Studierendenberatung','Demo-Link für eine Beispielseite der psychologischen Studierendenberatung. Vor dem Einsatz durch den tatsächlichen Kontakt deiner Hochschule ersetzen.','https://psych-beratung.example.invalid/','Dummy-Link · Beispielseite']])}<div class="crisis"><h3>Du brauchst jetzt jemanden?</h3><a class="bigphone" href="tel:116123">116 123</a><p>TelefonSeelsorge – anonym, kostenfrei und rund um die Uhr.</p></div>${nav(['IU-Kontakte ansehen','kontakt'],['Zu Krisenhilfen','krise'],['Persönlicher Austausch','forum'])}</section>`}
const iu=[
{title:'Studierendensekretariat',desc:'Fragen zu Bescheinigungen, Kursbuchungen, Studiengang- oder Zeitmodellwechsel und myCampus.',phone:'030 0000 0000 (Demo)',email:'studium-fernstudium@iu.org¹',hours:'Mo–Fr 9–17 Uhr (Demo)',link:'https://www.iu.de/hochschule/studierendensekretariat/',label:'Offizielle Kontaktseite'},
{title:'Gleichstellungsbüro · Diversity & Beratung',desc:'Vertrauliche Beratung unter anderem bei Diskriminierung, sexueller Belästigung, Stalking oder digitaler Gewalt. Studierende finden weitere Kontaktwege in myCampus.',phone:'030 0000 0000 (Demo)',email:'diversity@iu.org',hours:'Mo–Fr 9–17 Uhr (Demo)',link:'https://www.iu.de/hochschule/diversity-und-gleichstellung/beratung-und-guide/',label:'Beratung & Guide'},
{title:'Study Coaching',desc:'Unterstützung bei Lernstrategien, Zeitmanagement, Motivation sowie Resilienz und Stressmanagement. Termine werden über myCampus gebucht.',phone:'030 0000 0000 (Demo)',email:'coaching@example.invalid (Demo)',hours:'Mo–Fr 9–17 Uhr (Demo)',link:'https://www.iu.de/lehre/study-und-career-coaching/',label:'Angebot ansehen'},
{title:'Studienberatung · allgemeiner IU-Kontakt',desc:'Allgemeine Beratung der IU. Für Anliegen zum laufenden Studium sind Studierendensekretariat oder myCampus meist der passende Einstieg.',phone:'+49 30 311 988 00',email:'info-fernstudium@iu.org',hours:'Mo–Fr 9–17 Uhr (Demo)',link:'https://www.iu.de/impressum/',label:'Offizielle Angaben'},
{title:'Studieninteressierte · Kontakt',desc:'Kontakt für Fragen zu Studienangeboten und Studienformaten. Für bereits immatrikulierte Studierende bitte den zuständigen Servicebereich nutzen.',phone:'+49 30 311 988 10',email:'info-studium@iu.org',hours:'Mo–Fr 9–17 Uhr (Demo)',link:'https://www.iu.de/hochschule/kontakt/',label:'Kontaktseite öffnen'},
{title:'Inklusionsteam',desc:'Vernetzung für inklusive Gestaltung des Studiums. Das Team kann per E-Mail kontaktiert werden.',phone:'030 0000 0000 (Demo)',email:'teaminklusion@iubh-fernstudium.de',hours:'Mo–Fr 9–17 Uhr (Demo)',link:'https://www.iu.de/studium-tipps/studieren-mit-beeintraechtigung/',label:'Informationen ansehen'}
];
function contactCard(c){const demoPhone=c.phone.includes('(Demo)');const demoEmail=c.email.includes('example.invalid');return `<article class="contact"><h3>${c.title}</h3><p>${c.desc}</p><div class="details"><div class="detail"><b>Telefon / Weg</b><span>${demoPhone?c.phone:`${c.phone.startsWith('+')?`<a href="tel:${c.phone.replace(/[^+\d]/g,'')}">${c.phone}</a>`:c.phone}`}</span></div><div class="detail"><b>E-Mail</b><span>${c.email.includes('@')?`<a href="mailto:${c.email.replace('¹','')}">${c.email}</a>`:c.email}</span></div><div class="detail"><b>Sprechzeiten</b><span>${c.hours}</span></div><div class="detail"><b>Offizieller Link</b><span><a href="${c.link}" target="_blank" rel="noopener">${c.label} ↗</a></span></div><div class="detail"><b>Demo-Link</b><span><a href="#demo-kontakt">Beispielkontakt ↗</a></span></div></div>${demoPhone||demoEmail||c.hours.includes('(Demo)')?'<span class="chip" style="margin-top:10px;color:#9b4e3d">Achtung: Kontaktdaten / Zeiten mit „Demo“ sind erfunden und nicht erreichbar.</span>':''}</article>`}
function kontakt(){app.innerHTML=`<section class="view">${head('Kontaktmöglichkeiten','Ansprechpersonen, die weiterhelfen.','Diese Seite bündelt Kontakte zu deinem Studienthema: vertrauliche Beratung, Gleichstellung, Studierendenservice und studentische Unterstützung.') }<div class="selector"><label for="hochschule">Deine Hochschule</label><select id="hochschule"><option value="iu">IU Internationale Hochschule (Beispiel)</option><option value="other">Andere Hochschule</option></select><span class="small">Weitere Hochschulen können ergänzt werden.</span></div><div class="notice" id="demo-kontakt"><b>Wichtig:</b> Kontaktdaten oder Sprechzeiten mit dem Zusatz „Demo“ sowie der „Demo-Link“ sind frei erfundene Musterwerte. Sie sind nicht erreichbar und dürfen nicht als echte IU-Kontakte veröffentlicht oder verwendet werden. Ohne diesen Zusatz angezeigte Kontaktdaten und offizielle Links wurden den jeweils verlinkten IU-Seiten entnommen.</div><div id="iuContacts">${iu.map(contactCard).join('')}<p class="small">¹ Die IU führt dieses Postfach auf ihrer englischen myCampus-Hilfeseite als Kontakt fürs Student Office. Bitte prüfe die zuständige Adresse auch im eingeloggten myCampus, da Kontaktwege je Studienformat abweichen können.</p></div><div id="otherContacts" class="notice hidden"><b>Kontakte für deine Hochschule:</b> Diese Demo enthält beispielhaft öffentliche IU-Kontakte. Bitte ergänze Name und offizielle Kontaktwege deiner Hochschule, bevor du diese Seite dort einsetzt. Psychologische Beratung, Gleichstellungsbüro, Studierendenservice und AStA/StuRa sind sinnvolle Startpunkte.</div>${nav(['Psychologische Beratung','psych'],['Studierenden-Austausch','forum'],['Krisenhilfe','krise'])}</section>`;document.querySelector('#hochschule').addEventListener('change',e=>{document.querySelector('#iuContacts').classList.toggle('hidden',e.target.value!=='iu');document.querySelector('#otherContacts').classList.toggle('hidden',e.target.value==='iu')})}
function helpline(name,info,num,href){return `<article class="help"><div><h3>${name}</h3><p>${info}</p></div><a class="phone" href="${href}">${num}<small>Anrufen ↗</small></a></article>`}
function krise(){app.innerHTML=`<section class="view">${head('Sofort Hilfe','Du musst gerade nicht allein sein.','Wenn du jetzt mit einer Person sprechen möchtest, erreichst du die TelefonSeelsorge direkt und rund um die Uhr.') }<div class="crisis"><h3>TelefonSeelsorge · anonym & kostenfrei</h3><a class="bigphone" href="tel:116123">116 123</a><p>Telefonisch rund um die Uhr erreichbar. Weitere Wege: Chat und Mail über die Website.</p><a class="cta" href="https://www.telefonseelsorge.de/" target="_blank" rel="noopener">TelefonSeelsorge öffnen ↗</a></div><div class="list">${helpline('Hilfetelefon „Gewalt gegen Frauen“','Anonym, kostenfrei, mehrsprachig und rund um die Uhr.','116 016','tel:116016')}${helpline('WEISSER RING','Opfer-Telefon · kostenfrei, anonym · täglich 7–22 Uhr.','116 006','tel:116006')}${helpline('Hilfe-Telefon Sexueller Missbrauch','Anonym und kostenfrei · Mo/Mi/Fr 9–14 Uhr, Di/Do 15–20 Uhr.','0800 22 55 530','tel:08002255530')}${helpline('HateAid','Beratung bei digitaler Gewalt · aktuelle Sprechzeiten online prüfen.','030 252 088 38','tel:+493025208838')}</div><div class="notice">Bei unmittelbarer Gefahr ruf <a href="tel:112">112</a> (Rettungsdienst) oder <a href="tel:110">110</a> (Polizei). Die Telefonnummern führen zu externen Angeboten.</div>${nav(['Zur Übersicht','home'],['Psychologische Beratung','psych'])}</section>`}
function forum(){app.innerHTML=`<section class="view">${head('Persönlicher Austausch','Ein offenes Ohr auf Augenhöhe.','Andere Studierende kennen Belastungen im Studium oft aus eigener Erfahrung. Du kannst klein anfangen und selbst entscheiden, wie viel du teilen möchtest.')}${opts([['Hochschulnah','AStA, StuRa oder Fachschaft','Dummy-Link zu einer beispielhaften Seite der studentischen Vertretung. Durch den echten AStA, StuRa oder die Fachschaft deiner Hochschule ersetzen.','https://asta.example.invalid/','Dummy-Link · AStA-Beispiel'],['Peer-Beratung','Aktives Zuhören','Dummy-Link zu einer beispielhaften Seite für studentische Peer-Beratung. Vor dem Einsatz durch das tatsächliche Angebot deiner Hochschule ersetzen.','https://peerberatung.example.invalid/','Dummy-Link · Peer-Beratung']])}<div class="notice"><b>Community-Hinweis:</b> Diese Version enthält kein öffentliches Forum. Ein echtes Forum braucht Moderation, Datenschutz, klare Verhaltensregeln und gut sichtbare Krisenhilfen.</div>${nav(['Hochschulkontakte','kontakt'],['Sofort Hilfe','krise'])}</section>`}
function geld(){app.innerHTML=`<section class="view">${head('Finanzielle Unterstützung','Wir suchen mit dir nach Orientierung.','Offizielle Anträge und Beratung hängen von deiner persönlichen Situation und deinem Wohnort ab.')}${opts([['Studienfinanzierung','BAföG beantragen','Offizieller digitaler Antrag und Informationen zur Ausbildungsförderung.','https://www.bafoeg-digital.de/','BAföG Digital'],['Wohnen','Wohngeld beantragen','Den passenden Online-Antrag findest du im Verwaltungsportal deines Bundeslands oder bei deiner Wohngeldstelle.','https://verwaltung.bund.de/portal/','Verwaltungsportal'],['Wohnraum','Wohnungsanzeigen finden','Der Dachverband Deutsches Studierendenwerk bietet Hinweise zur Wohnungssuche und führt zu den zuständigen lokalen Studierendenwerken und deren Wohnungsangeboten.','https://www.studierendenwerke.de/themen/wohnen/tipps-zur-wohnungssuche','Wohnungsangebote finden ↗'],['Studienstart','Studienstarthilfe beantragen','Antrag und Voraussetzungen findest du bei BAföG Digital.','https://www.bafoeg-digital.de/studienstarthilfe','Studienstarthilfe ansehen'],['Persönliche Beratung','Sozialberatung','Dummy-Link zu einer beispielhaften Seite für Sozialberatung. Durch die Sozialberatung deines örtlichen Studierendenwerks oder deiner Hochschule ersetzen.','https://sozialberatung.example.invalid/','Dummy-Link · Sozialberatung']])}<div class="notice">Nutze für Anträge möglichst offizielle Behördenportale. Eine Sozialberatung kann dir helfen, den passenden nächsten Schritt zu finden. Demo-Links mit „Dummy-Link“ sind erfundene Platzhalter und führen nicht zu echten Angeboten.</div>${nav(['Hochschulkontakte','kontakt'],['Zur Übersicht','home'])}</section>`}
function privacy(){app.innerHTML=`<section class="view">${head('Hinweise','Transparenz und Datenschutz.','Diese Demo speichert keine Eingaben und enthält keine Registrierung.')}${opts([['Datenschutz','Keine Formulare in dieser Demo','Die Seite übermittelt keine persönlichen Daten. Externe Links öffnen Angebote anderer Anbieter.','',''],['Bitte beachten','Angebote und Angaben prüfen','Kontaktdaten und Erreichbarkeiten können sich ändern. Vor einer Veröffentlichung bitte lokale Kontakte ergänzen und die Angaben regelmäßig prüfen. Es wird keine Therapie oder ein Therapieplatz zugesichert.','','']])}${nav(['Zur Startseite','home'])}</section>`}
